[project]
name = "locus"
version = "0.1.0"
description = "Locus — a general-purpose agent platform."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
    # core
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sse-starlette>=2.1",
    "websockets>=12",
    # providers
    "anthropic>=0.40",
    "openai>=1.40",
    "google-genai>=1.0",
    "httpx>=0.27",
    # storage
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    # observability
    "structlog>=24.1",
    "opentelemetry-api>=1.25",
    # config
    "pydantic-settings>=2.3",
    # browser
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-httpserver>=1.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
locus-core = "core.app:main"
locus-endpoint = "endpoint.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "endpoint", "shared"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["core", "endpoint", "shared"]

[[tool.mypy.overrides]]
module = ["google.genai.*", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
